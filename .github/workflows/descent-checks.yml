name: Descent Gap finite-prefix checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  finite-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bounded parity-prefix algebra and residues
        run: python3 research/verification/finite_survival.py
